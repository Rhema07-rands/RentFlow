services:
  # 1. RentFlow Backend API (.NET 9 Web API in Docker)
  - type: web
    name: rentflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # 2. RentFlow Web Frontend (React + Vite SPA)
  - type: web
    name: rentflow-web
    runtime: static
    rootDir: RentFlow.Web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: rentflow-api
          property: host
      - key: VITE_PAYSTACK_PUBLIC_KEY
        value: pk_test_e397d340917a03d2818924f283ee356174f13457
