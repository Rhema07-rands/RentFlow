services:
  # 1. RentFlow Backend API (.NET 9 Web API in Docker)
  - type: web
    name: rentflow-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # 2. RentFlow Web Frontend (React + Vite SPA)
  - type: web
    name: rentflow-web
    runtime: static
    plan: free
    rootDir: RentFlow.Web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
